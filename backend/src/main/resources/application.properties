spring.application.name=syndicare-backend
server.port=8080
server.servlet.context-path=/api

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

syndicare.storage.location=./uploads

syndicare.jwt.secret=ChangeMeInProduction_SyndiCareSecretKeyForJwtSigning_MustBeAtLeast256Bits_ABCDEFGHIJKLMNOP
syndicare.jwt.expiration-ms=86400000

syndicare.cors.allowed-origins=http://localhost:5173,http://localhost:3000
